<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>iPhoneMiror Sign In</title>
<style>
  :root { color-scheme: dark light; --bg:#0a0a0b; --fg:#f5f5f7; --muted:#a1a1a6; --card:#151517; --line:#26262a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f5; --fg:#111; --muted:#5f5f64; --card:#fff; --line:#e3e3e6; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 16px; }
  a.button { display:inline-block; background:var(--fg); color:var(--bg); text-decoration:none; padding:10px 18px; border-radius:10px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to iPhoneMiror…</h1>
  <p id="text">If nothing happens, select the button below.</p>
  <a class="button" id="open" href="#">Open iPhoneMiror</a>
</main>
<script>
  // Relay for Sign in with Apple (response_mode=fragment). Apple redirects here with the result in the URL
  // fragment, which never reaches any server. This page only forwards it to the local app via iphonemiror://.
  (function () {
    var fragment = window.location.hash.replace(/^#/, "");
    var params = new URLSearchParams(fragment);
    var allowed = ["state", "code", "id_token", "error", "user"];
    var forward = new URLSearchParams();
    allowed.forEach(function (k) { if (params.has(k)) forward.set(k, params.get(k)); });
    var link = document.getElementById("open");
    if (!forward.has("state") && !forward.has("error")) {
      document.getElementById("title").textContent = "Nothing to forward";
      document.getElementById("text").textContent = "Start Sign in with Apple from iPhoneMiror.";
      link.style.display = "none";
      return;
    }
    var target = "iphonemiror://auth/callback?" + forward.toString();
    link.href = target;
    history.replaceState(null, "", window.location.pathname);
    window.location.href = target;
  })();
</script>
</body>
</html>
